<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="100%">
  <defs>
    <filter id="green-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#0D2E14" />
    </pattern>
    <pattern id="scanlines-green" width="100" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.45"/>
    </pattern>
  </defs>

  <style>
    @keyframes snake-crawl {
      0% { transform: translate(0, 0); }
      25% { transform: translate(80px, 0); }
      50% { transform: translate(80px, 40px); }
      75% { transform: translate(180px, 40px); }
      100% { transform: translate(180px, -20px); }
    }
    @keyframes apple-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.6; }
    }
    .green { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #1AF576; filter: url(#green-glow); }
    .green-bright { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #D6FFE3; filter: url(#green-glow); }
    .green-dim { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #12632C; }
    .snake-body { fill: #1AF576; filter: url(#green-glow); }
    .snake-head { fill: #D6FFE3; filter: url(#green-glow); }
    .apple { fill: #FF3344; transform-origin: 640px 120px; animation: apple-pulse 1.2s infinite ease-in-out; }
    .animated-snake { animation: snake-crawl 6s infinite alternate ease-in-out; }
  </style>

  <!-- Green Phosphor CRT Arcade Bezel -->
  <rect x="2" y="2" width="876" height="236" rx="14" fill="#040A06" stroke="#0F3818" stroke-width="2"/>

  <!-- CRT Grid Playfield -->
  <rect x="15" y="45" width="850" height="175" rx="8" fill="#020503" stroke="#0A2410" stroke-width="1"/>
  <rect x="15" y="45" width="850" height="175" rx="8" fill="url(#grid-dots)" />

  <!-- Top Arcade HUD -->
  <g class="green-dim" font-size="11" letter-spacing="2">
    <text x="25" y="28">ROM: SNAKE-II // CRT-99</text>
    <text x="400" y="28" class="green">● HIGH SCORE: 094820</text>
    <text x="850" y="28" text-anchor="end">LIVES: ♥ ♥ ♥</text>
    <line x1="2" y1="40" x2="878" y2="40" stroke="#0D2E14" stroke-width="1.5"/>
  </g>

  <!-- Food Pellet / Target (Glowing Red Apple) -->
  <circle cx="640" cy="120" r="6" class="apple"/>

  <!-- Animated Green CRT Snake -->
  <g class="animated-snake">
    <!-- Snake Segments -->
    <rect x="180" y="112" width="16" height="16" rx="3" class="snake-body" opacity="0.6"/>
    <rect x="200" y="112" width="16" height="16" rx="3" class="snake-body" opacity="0.7"/>
    <rect x="220" y="112" width="16" height="16" rx="3" class="snake-body" opacity="0.8"/>
    <rect x="240" y="112" width="16" height="16" rx="3" class="snake-body" opacity="0.9"/>
    <rect x="260" y="112" width="16" height="16" rx="3" class="snake-body"/>
    <rect x="280" y="112" width="16" height="16" rx="3" class="snake-body"/>
    <rect x="300" y="112" width="16" height="16" rx="3" class="snake-body"/>
    <rect x="320" y="112" width="16" height="16" rx="3" class="snake-body"/>
    <!-- Head -->
    <rect x="340" y="112" width="18" height="16" rx="4" class="snake-head"/>
    <!-- Eyes -->
    <circle cx="352" cy="116" r="2" fill="#040A06"/>
    <circle cx="352" cy="124" r="2" fill="#040A06"/>
  </g>

  <!-- Bottom Mini Console Message -->
  <g class="green" font-size="11">
    <text x="35" y="202">COINS: 02</text>
    <text x="440" y="202" text-anchor="middle" class="green-bright">PRESS [ANY KEY] TO INSERT COIN</text>
    <text x="845" y="202" text-anchor="end" class="green-dim">PHOSPHOR: P1-GREEN</text>
  </g>

  <!-- Scanlines Overlay -->
  <rect x="15" y="45" width="850" height="175" rx="8" fill="url(#scanlines-green)" pointer-events="none"/>
</svg>
