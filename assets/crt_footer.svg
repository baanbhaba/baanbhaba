<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 70" width="100%" height="100%">
  <defs>
    <filter id="amber-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .amber { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #FFB000; filter: url(#amber-glow); }
    .amber-dim { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #5A3B00; }
  </style>

  <!-- Frame -->
  <rect x="2" y="2" width="876" height="66" rx="10" fill="#0A0806" stroke="#261A0E" stroke-width="1.5"/>
  <text x="440" y="38" text-anchor="middle" class="amber" font-size="12" letter-spacing="3">▲▲▲ [END OF TRANSMISSION // SIGNAL LOST] ▲▲▲</text>
</svg>
