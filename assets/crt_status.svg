<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="100%">
  <defs>
    <filter id="amber-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.35; } }
    .amber { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #FFB000; filter: url(#amber-glow); }
    .amber-dim { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #7A5000; }
    .amber-bright { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #FFF2D6; filter: url(#amber-glow); }
    .pulse { animation: pulse 2.5s infinite ease-in-out; }
  </style>

  <!-- Clean Flat Terminal Frame -->
  <rect x="2" y="2" width="876" height="176" rx="12" fill="#0A0806" stroke="#261A0E" stroke-width="1.5"/>

  <!-- Left: Flat Minimal Metrics -->
  <g class="amber" font-size="12">
    <text x="35" y="45" class="amber-dim">SYSTEM METRICS // NOISE FEED</text>

    <text x="35" y="80">ACTIVITY</text>
    <text x="140" y="80" class="amber-bright">[ RANDOM ]</text>

    <text x="35" y="110">CAFFEINE</text>
    <text x="140" y="110" class="amber-bright">[ HAZARDOUS ]</text>

    <text x="35" y="140">STATUS</text>
    <text x="140" y="140" class="amber-bright">[ FLOATING ]</text>
  </g>

  <!-- Divider -->
  <line x1="280" y1="25" x2="280" y2="155" stroke="#1F150B" stroke-width="1.5"/>

  <!-- Right: Clean Minimal Waveform -->
  <g transform="translate(305, 25)">
    <text x="15" y="20" class="amber-dim" font-size="10">AUDIO // SIGNAL OSCILLATION</text>
    
    <!-- Clean Single Glow Wave -->
    <path d="M 15 75 C 60 10, 100 130, 150 75 C 190 20, 230 110, 270 75 C 310 40, 360 90, 400 75 C 450 15, 490 120, 530 75" 
          fill="none" stroke="#FFB000" stroke-width="2" filter="url(#amber-glow)" class="pulse"/>
          
    <text x="430" y="125" class="amber-dim" font-size="10">SYNCHRONIZED</text>
  </g>
</svg>
