<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="100%">
  <defs>
    <filter id="cyan-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes wave-pulse { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.35; } }
    .cyan { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace; fill: #00F5D4; filter: url(#cyan-glow); }
    .cyan-dim { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace; fill: #0A5A50; }
    .cyan-bright { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace; fill: #D6FFF8; filter: url(#cyan-glow); font-weight: bold; }
    .wave { animation: wave-pulse 2.5s infinite ease-in-out; }
  </style>

  <rect x="2" y="2" width="876" height="176" rx="12" fill="#04090A" stroke="#0E2B2A" stroke-width="1.5"/>

  <!-- Left: Cyan Metrics -->
  <g class="cyan" font-size="12">
    <text x="35" y="45" class="cyan-dim">SYSTEM METRICS // NOISE FEED</text>

    <text x="35" y="80">ACTIVITY</text>
    <text x="140" y="80" class="cyan-bright">[ RANDOM ]</text>

    <text x="35" y="110">CAFFEINE</text>
    <text x="140" y="110" class="cyan-bright">[ HAZARDOUS ]</text>

    <text x="35" y="140">STATUS</text>
    <text x="140" y="140" class="cyan-bright">[ FLOATING ]</text>
  </g>

  <!-- Divider -->
  <line x1="280" y1="25" x2="280" y2="155" stroke="#091F1E" stroke-width="1.5"/>

  <!-- Right: Cyan Waveform -->
  <g transform="translate(305, 25)">
    <text x="15" y="20" class="cyan-dim" font-size="10">AUDIO // SIGNAL OSCILLATION</text>
    
    <path d="M 15 75 C 60 10, 100 130, 150 75 C 190 20, 230 110, 270 75 C 310 40, 360 90, 400 75 C 450 15, 490 120, 530 75" 
          fill="none" stroke="#00F5D4" stroke-width="2" filter="url(#cyan-glow)" class="wave"/>
          
    <text x="430" y="125" class="cyan-dim" font-size="10">SYNCHRONIZED</text>
  </g>
</svg>
