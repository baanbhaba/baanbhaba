<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="100%">
  <defs>
    <filter id="crt-amber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines-dense" width="100" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.4; } }
    .amber { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #FFB000; filter: url(#crt-amber-glow); }
    .amber-dim { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #A56800; }
    .amber-bright { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #FFF2D6; filter: url(#crt-amber-glow); }
    .sig-pulse { animation: pulse 2s infinite ease-in-out; }
  </style>

  <!-- Monitor Card Bezel -->
  <rect x="5" y="5" width="870" height="230" rx="16" fill="#0c0906" stroke="#2a1e12" stroke-width="2.5"/>
  <rect x="15" y="15" width="850" height="210" rx="10" fill="#060402" stroke="#181109" stroke-width="1.5"/>

  <!-- CRT Grid / Monitor HUD -->
  <g class="amber-dim" font-size="11" letter-spacing="1">
    <text x="35" y="42">SYSTEM ID: BB-9900</text>
    <text x="360" y="42">FREQ: 144.00 MHz</text>
    <text x="680" y="42">BAUD: 9600 [OK]</text>
    <line x1="35" y1="52" x2="845" y2="52" stroke="#2a1e12" stroke-width="1.5"/>
  </g>

  <!-- Left Column: Metrics -->
  <g class="amber" font-size="13" font-weight="bold">
    <text x="35" y="85">● CORE ENTROPY</text>
    <text x="210" y="85" class="amber-bright">[ 99.8% ]</text>
    
    <text x="35" y="115">● VRAM USAGE</text>
    <text x="210" y="115" class="amber-bright">[ 12.4 GB ]</text>
    
    <text x="35" y="145">● DAILY STREAK</text>
    <text x="210" y="145" class="amber-bright">[ INFINITE ]</text>
    
    <text x="35" y="175">● SIGNAL NOISE</text>
    <text x="210" y="175" class="amber-bright">[ 0.02 dB ]</text>
  </g>

  <!-- Center Divider -->
  <line x1="320" y1="65" x2="320" y2="205" stroke="#2a1e12" stroke-width="1.5"/>

  <!-- Right Column: Oscilloscope Graphic & Telemetry Wave -->
  <g transform="translate(345, 65)">
    <rect x="0" y="0" width="490" height="135" rx="8" fill="#0a0704" stroke="#20150a" stroke-width="1"/>
    
    <!-- Grid -->
    <line x1="0" y1="35" x2="490" y2="35" stroke="#181109" stroke-width="1"/>
    <line x1="0" y1="70" x2="490" y2="70" stroke="#181109" stroke-width="1"/>
    <line x1="0" y1="105" x2="490" y2="105" stroke="#181109" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="135" stroke="#181109" stroke-width="1"/>
    <line x1="245" y1="0" x2="245" y2="135" stroke="#181109" stroke-width="1"/>
    <line x1="370" y1="0" x2="370" y2="135" stroke="#181109" stroke-width="1"/>

    <!-- Oscilloscope Waveform -->
    <path d="M 10 70 Q 50 15, 90 70 T 170 70 T 230 20 T 270 120 T 320 70 T 390 70 T 440 30 T 480 70" 
          fill="none" stroke="#FFB000" stroke-width="2.5" filter="url(#crt-amber-glow)" class="sig-pulse"/>

    <text x="15" y="24" class="amber-dim" font-size="10">CHANNEL A: HYPRLAND_WAYLAND_FEED</text>
    <text x="360" y="125" class="amber-bright" font-size="11" font-weight="bold">SYNCHRONIZED</text>
  </g>

  <!-- Scanlines -->
  <rect x="15" y="15" width="850" height="210" rx="10" fill="url(#scanlines-dense)" pointer-events="none"/>
</svg>
