<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="100%" height="100%">
  <defs>
    <filter id="crimson-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .crimson { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace; fill: #FF3366; filter: url(#crimson-glow); }
    .crimson-bright { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace; fill: #FFE6EC; filter: url(#crimson-glow); font-weight: bold; }
    .crimson-dim { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace; fill: #6E1A2C; }
    .status-tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace; font-size: 10px; fill: #FF3366; font-weight: bold; }
  </style>

  <rect x="2" y="2" width="876" height="206" rx="12" fill="#0D0607" stroke="#361518" stroke-width="1.5"/>

  <line x1="2" y1="36" x2="878" y2="36" stroke="#240D10" stroke-width="1.5"/>
  <text x="25" y="24" class="crimson-dim" font-size="11" letter-spacing="2">PROCESS MONITOR // DISTRACTIONS</text>
  <text x="850" y="24" text-anchor="end" class="crimson-dim" font-size="10">STATUS: IRREVERSIBLE</text>

  <!-- Distraction 1 -->
  <g transform="translate(25, 55)">
    <text x="0" y="16" class="crimson-bright" font-size="13">● SIM RACING</text>
    <text x="180" y="16" class="crimson-dim" font-size="12">Driving fast digital cars directly into tyre barriers</text>
    <text x="850" y="16" text-anchor="end" class="status-tag">[ CRITICAL ]</text>
  </g>

  <line x1="25" y1="90" x2="855" y2="90" stroke="#210C0F" stroke-width="1"/>

  <!-- Distraction 2 -->
  <g transform="translate(25, 105)">
    <text x="0" y="16" class="crimson-bright" font-size="13">● SHOOTERS</text>
    <text x="180" y="16" class="crimson-dim" font-size="12">Spending 30 mins choosing a crosshair, dying instantly</text>
    <text x="850" y="16" text-anchor="end" class="status-tag">[ 0 / 14 K/D ]</text>
  </g>

  <line x1="25" y1="140" x2="855" y2="140" stroke="#210C0F" stroke-width="1"/>

  <!-- Distraction 3 -->
  <g transform="translate(25, 155)">
    <text x="0" y="16" class="crimson-bright" font-size="13">● LINUX RICE</text>
    <text x="180" y="16" class="crimson-dim" font-size="12">Changing wallpapers and border radii every 12 minutes</text>
    <text x="850" y="16" text-anchor="end" class="status-tag">[ INFINITE LOOP ]</text>
  </g>
</svg>
