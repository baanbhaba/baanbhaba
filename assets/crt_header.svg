<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <filter id="amber-subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .amber { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #FFB000; filter: url(#amber-subtle-glow); }
    .amber-dim { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #7A5000; }
    .cursor { animation: blink 1s infinite; fill: #FFB000; }
  </style>

  <!-- Clean Flat Slate Terminal Box with 1px Amber Accent Border -->
  <rect x="2" y="2" width="896" height="236" rx="14" fill="#0A0806" stroke="#261A0E" stroke-width="2"/>
  
  <!-- Window Header Bar -->
  <line x1="2" y1="42" x2="898" y2="42" stroke="#1A120A" stroke-width="1.5"/>
  <circle cx="28" cy="22" r="5" fill="#FF5555" />
  <circle cx="46" cy="22" r="5" fill="#FFB000" />
  <circle cx="64" cy="22" r="5" fill="#55FF55" />
  <text x="450" y="26" text-anchor="middle" class="amber-dim" font-size="11" font-weight="bold" letter-spacing="2">SESSION // TTY1 — UNIDENTIFIED</text>

  <!-- Minimal ASCII Logo -->
  <g class="amber" font-size="14" font-weight="bold" xml:space="preserve">
    <text x="210" y="85">  _                     _     _           _           </text>
    <text x="210" y="103"> | |__   __ _  __ _ _ _| |__ | |__   __ _| |__   __ _ </text>
    <text x="210" y="121"> | '_ \ / _` |/ _` | '_ \ '_ \| '_ \ / _` | '_ \ / _` |</text>
    <text x="210" y="139"> |_.__/ \__,_|\__,_|_| |_|_.__/|_.__/ \__,_|_.__/ \__,_|</text>
  </g>

  <!-- Minimal Status & Blinking Prompt -->
  <g class="amber-dim" font-size="12">
    <text x="60" y="180">status: online  ·  location: unknown  ·  vibes: unspecified</text>
  </g>

  <g class="amber" font-size="14" font-weight="bold">
    <text x="60" y="210">> ./baanbhaba</text>
    <rect x="185" y="196" width="9" height="16" class="cursor"/>
  </g>
</svg>
