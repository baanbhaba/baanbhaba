<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- CRT Screen Glow & Scanlines Filter -->
    <filter id="crt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB000"/>
      <stop offset="50%" stop-color="#FF8800"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
    <linearGradient id="bezel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2520"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
    <radialGradient id="screen-glare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb000" stop-opacity="0.08"/>
      <stop offset="80%" stop-color="#0a0805" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050403" stop-opacity="1"/>
    </radialGradient>
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.6" opacity="0.45"/>
    </pattern>
  </defs>

  <style>
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes scanline-flicker { 0% { opacity: 0.85; } 50% { opacity: 0.95; } 100% { opacity: 0.85; } }
    .amber-text { font-family: 'Courier New', 'JetBrains Mono', monospace; fill: #FFB000; filter: url(#crt-glow); }
    .amber-bright { fill: #FFF0D0; filter: url(#crt-glow); }
    .amber-dim { font-family: 'Courier New', monospace; fill: #8F5500; }
    .cursor-blink { animation: blink 0.9s infinite; }
    .crt-tube { animation: scanline-flicker 0.15s infinite; }
  </style>

  <!-- TV Exterior Retro Bezel -->
  <rect x="10" y="10" width="880" height="300" rx="36" ry="36" fill="url(#bezel-grad)" stroke="#453a30" stroke-width="4"/>
  <rect x="25" y="25" width="850" height="270" rx="26" ry="26" fill="#080604" stroke="#1c1610" stroke-width="3"/>

  <!-- Screen Glass / Glare -->
  <rect x="35" y="35" width="830" height="250" rx="20" ry="20" fill="url(#screen-glare)" />

  <!-- VHS OSD Header -->
  <g class="amber-text" font-size="13" font-weight="bold" letter-spacing="2">
    <text x="60" y="70">● REC  [SP]</text>
    <text x="400" y="70">CH 03  NTSC-U</text>
    <text x="730" y="70">PLAY ▶  0:42:19</text>
  </g>

  <!-- Main ASCII Art Logo -->
  <g class="amber-text" font-size="15" font-weight="bold" xml:space="preserve">
    <text x="180" y="120">  _                     _     _           _           </text>
    <text x="180" y="138"> | |__   __ _  __ _ _ _| |__ | |__   __ _| |__   __ _ </text>
    <text x="180" y="156"> | '_ \ / _` |/ _` | '_ \ '_ \| '_ \ / _` | '_ \ / _` |</text>
    <text x="180" y="174"> |_.__/ \__,_|\__,_|_| |_|_.__/|_.__/ \__,_|_.__/ \__,_|</text>
  </g>

  <!-- System Boot Lines -->
  <g class="amber-dim" font-size="12" letter-spacing="1">
    <text x="60" y="215">[SYS_OK]  VRAM 640KB INITIALIZED  ·  ENTROPY: OPTIMAL</text>
    <text x="60" y="235">[DEV_ENV] HYPRLAND // WAYLAND // NEOVIM // AES-256 VAULT</text>
  </g>

  <!-- Prompt Command line -->
  <g class="amber-text" font-size="14" font-weight="bold">
    <text x="60" y="265">> ./baanbhaba --vibe=chaotic --caffeine=max</text>
    <rect x="430" y="252" width="10" height="15" fill="#FFB000" class="cursor-blink" />
  </g>

  <!-- CRT Scanlines Overlay -->
  <rect x="35" y="35" width="830" height="250" rx="20" ry="20" fill="url(#scanlines)" pointer-events="none" class="crt-tube"/>
</svg>
