<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="100%">
  <defs>
    <filter id="amber-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .amber { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #FFB000; filter: url(#amber-glow); }
    .amber-bright { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #FFF0D0; filter: url(#amber-glow); font-weight: bold; }
    .amber-dim { font-family: 'JetBrains Mono', 'Courier New', monospace; fill: #7A5000; }
    .tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #FFAA00; }
  </style>

  <!-- Frame -->
  <rect x="2" y="2" width="876" height="196" rx="12" fill="#0A0806" stroke="#261A0E" stroke-width="1.5"/>

  <!-- Title bar -->
  <line x1="2" y1="36" x2="878" y2="36" stroke="#1A120A" stroke-width="1.5"/>
  <text x="25" y="24" class="amber-dim" font-size="11" letter-spacing="2">DIRECTORY // REPOSITORIES</text>
  <text x="850" y="24" text-anchor="end" class="amber-dim" font-size="10">3 ARTIFACTS FOUND</text>

  <!-- Item 1: bettea-note -->
  <g transform="translate(25, 55)">
    <text x="0" y="16" class="amber-bright" font-size="13">> bettea-note</text>
    <text x="160" y="16" class="amber-dim" font-size="12">Encrypted thought journal with 13 hand-crafted themes</text>
    <rect x="740" y="2" width="85" height="20" rx="4" fill="#140E06" stroke="#FFB000" stroke-width="1"/>
    <text x="782" y="16" text-anchor="middle" class="tag">PYTHON / QT</text>
  </g>

  <line x1="25" y1="95" x2="855" y2="95" stroke="#150E07" stroke-width="1"/>

  <!-- Item 2: dotfiles -->
  <g transform="translate(25, 110)">
    <text x="0" y="16" class="amber-bright" font-size="13">> dotfiles</text>
    <text x="160" y="16" class="amber-dim" font-size="12">Minimalist Wayland &amp; Hyprland desktop environment</text>
    <rect x="740" y="2" width="85" height="20" rx="4" fill="#140E06" stroke="#FF8800" stroke-width="1"/>
    <text x="782" y="16" text-anchor="middle" class="tag">HYPRLAND</text>
  </g>

  <line x1="25" y1="150" x2="855" y2="150" stroke="#150E07" stroke-width="1"/>

  <!-- Item 3: project-alchemi -->
  <g transform="translate(25, 165)">
    <text x="0" y="16" class="amber-bright" font-size="13">> project-alchemi</text>
    <text x="160" y="16" class="amber-dim" font-size="12">Random experimental code sandbox and prototypes</text>
    <rect x="740" y="2" width="85" height="20" rx="4" fill="#140E06" stroke="#FF5500" stroke-width="1"/>
    <text x="782" y="16" text-anchor="middle" class="tag">TYPESCRIPT</text>
  </g>
</svg>
