<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="100%">
  <defs>
    <filter id="violet-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .violet { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace; fill: #A89FF9; filter: url(#violet-glow); }
    .violet-bright { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace; fill: #F0EDFF; filter: url(#violet-glow); font-weight: bold; }
    .violet-dim { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace; fill: #483C7D; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace; font-size: 10px; fill: #A89FF9; }
  </style>

  <rect x="2" y="2" width="876" height="196" rx="12" fill="#08070D" stroke="#231C38" stroke-width="1.5"/>

  <line x1="2" y1="36" x2="878" y2="36" stroke="#161224" stroke-width="1.5"/>
  <text x="25" y="24" class="violet-dim" font-size="11" letter-spacing="2">DIRECTORY // REPOSITORIES</text>
  <text x="850" y="24" text-anchor="end" class="violet-dim" font-size="10">3 ARTIFACTS FOUND</text>

  <!-- Item 1: bettea-note -->
  <g transform="translate(25, 55)">
    <text x="0" y="16" class="violet-bright" font-size="13">> bettea-note</text>
    <text x="160" y="16" class="violet-dim" font-size="12">Encrypted thought journal with 13 hand-crafted themes</text>
    <rect x="740" y="2" width="85" height="20" rx="4" fill="#120E1E" stroke="#A89FF9" stroke-width="1"/>
    <text x="782" y="16" text-anchor="middle" class="tag">PYTHON / QT</text>
  </g>

  <line x1="25" y1="95" x2="855" y2="95" stroke="#140F22" stroke-width="1"/>

  <!-- Item 2: dotfiles -->
  <g transform="translate(25, 110)">
    <text x="0" y="16" class="violet-bright" font-size="13">> dotfiles</text>
    <text x="160" y="16" class="violet-dim" font-size="12">Minimalist Wayland &amp; Hyprland desktop environment</text>
    <rect x="740" y="2" width="85" height="20" rx="4" fill="#120E1E" stroke="#7928CA" stroke-width="1"/>
    <text x="782" y="16" text-anchor="middle" class="tag">HYPRLAND</text>
  </g>

  <line x1="25" y1="150" x2="855" y2="150" stroke="#140F22" stroke-width="1"/>

  <!-- Item 3: project-alchemi -->
  <g transform="translate(25, 165)">
    <text x="0" y="16" class="violet-bright" font-size="13">> project-alchemi</text>
    <text x="160" y="16" class="violet-dim" font-size="12">Random experimental code sandbox and prototypes</text>
    <rect x="740" y="2" width="85" height="20" rx="4" fill="#120E1E" stroke="#A89FF9" stroke-width="1"/>
    <text x="782" y="16" text-anchor="middle" class="tag">TYPESCRIPT</text>
  </g>
</svg>
